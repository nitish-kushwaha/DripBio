<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — DripBio</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Outfit:wght@400;600;700&family=Bangers&family=Pacifico&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="page-dashboard">

  <!-- Navbar -->
  <nav class="dash-nav">
    <span class="dash-brand">DripBio<span style="color:var(--neon-cyan)">.</span>bond</span>
    <div class="dash-nav-right">
      <div class="user-pill">
        <img id="user-pill-avatar" src="" alt="avatar" />
        <span id="user-pill-name">@loading…</span>
      </div>
      <a href="/admin.html" class="btn btn-ghost btn-sm" id="admin-panel-btn" style="display:none; border-color:var(--neon-cyan); color:var(--neon-cyan)">Admin</a>
      <button class="btn btn-ghost btn-sm" id="logout-btn">Log Out</button>
    </div>
  </nav>

  <main class="dash-layout">

    <!-- ── LEFT: Profile + Customize ── -->
    <section class="glass panel left-panel">

      <!-- Tabs -->
      <div class="panel-tabs">
        <button class="panel-tab active" id="tab-btn-profile">👤 Profile</button>
        <button class="panel-tab"        id="tab-btn-customize">🎨 Customize</button>
      </div>

      <!-- ── TAB: Profile ── -->
      <div id="tab-profile">
        <div class="avatar-section">
          <img id="profile-avatar-img" class="avatar-img" src="" alt="avatar" />
          <p style="font-size:0.75rem;color:var(--text-muted)">Avatar style</p>
          <div class="avatar-styles">
            <button class="avatar-style-btn" data-style="lorelei">Lorelei</button>
            <button class="avatar-style-btn" data-style="micah">Micah</button>
            <button class="avatar-style-btn" data-style="bottts">Bottts</button>
            <button class="avatar-style-btn" data-style="avataaars">Avataaars</button>
            <button class="avatar-style-btn" data-style="pixel-art">Pixel</button>
          </div>
        </div>

        <div style="display:flex;flex-direction:column;gap:var(--space-md)">
          <div class="form-group">
            <label for="display-name-input">Display Name</label>
            <input id="display-name-input" type="text" placeholder="Your Name" maxlength="40" />
          </div>
          <div class="form-group">
            <label for="bio-input">Bio</label>
            <textarea id="bio-input" placeholder="Creator · Dreamer · Builder ✨" maxlength="160"></textarea>
          </div>
          <button class="btn btn-primary w-full" id="save-profile-btn">Save Profile</button>
        </div>

        <div style="margin-top:var(--space-lg)">
          <p style="font-size:0.72rem;color:var(--text-muted);margin-bottom:var(--space-sm);text-transform:uppercase;letter-spacing:0.05em;font-weight:600">Your Link</p>
          <div class="share-url-box">
            <span class="share-url-text" id="profile-url-display">dripbio.bond/…</span>
            <button class="icon-btn" id="copy-link-btn" title="Copy">📋</button>
          </div>
        </div>
      </div>

      <!-- ── TAB: Customize ── -->
      <div id="tab-customize" style="display:none">
        <div class="customize-section">

          <!-- Theme -->
          <div>
            <div class="cust-label">🌈 Theme</div>
            <div class="theme-grid" id="theme-grid"></div>
            <div style="display:flex;align-items:center;gap:8px;margin-top:14px">
              <label style="font-size:0.75rem;color:var(--text-muted);white-space:nowrap;text-transform:none;letter-spacing:0;margin:0">Custom BG</label>
              <input type="color" id="custom-bg-input" value="#0f0f0f"
                style="flex:1;height:34px;border-radius:8px;border:1px solid var(--border-glass);background:transparent;cursor:pointer;padding:2px 4px" />
            </div>
          </div>

          <!-- Font -->
          <div>
            <div class="cust-label">✍️ Typography</div>
            <div id="font-picker" style="display:flex;flex-direction:column;gap:5px"></div>
          </div>

          <!-- Button Shape -->
          <div>
            <div class="cust-label">📐 Button Shape</div>
            <div class="pick-row" id="btn-shape-picker">
              <button class="pick-opt" data-shape="soft"  style="border-radius:8px">Soft</button>
              <button class="pick-opt" data-shape="pill"  style="border-radius:20px">Pill</button>
              <button class="pick-opt" data-shape="sharp">Sharp</button>
            </div>
          </div>

          <!-- Button Fill -->
          <div>
            <div class="cust-label">🎨 Button Fill</div>
            <div class="pick-row" id="btn-fill-picker">
              <button class="pick-opt" data-fill="glass">Glass</button>
              <button class="pick-opt" data-fill="solid">Solid</button>
              <button class="pick-opt" data-fill="outline">Outline</button>
            </div>
          </div>

          <!-- Social Links -->
          <div>
            <div class="cust-label">📲 Social Links</div>
            <div id="socials-form" style="display:flex;flex-direction:column;gap:6px"></div>
            <button class="btn btn-ghost btn-sm w-full" id="save-socials-btn" style="margin-top:10px">
              Save Social Links
            </button>
          </div>

        </div>
      </div>

    </section>

    <!-- ── CENTER: Links ── -->
    <section class="glass panel links-panel">
      <div class="panel-title">🔗 <span>Your Links</span>
        <span style="font-size:0.7rem;color:var(--text-muted);font-weight:400;text-transform:none;letter-spacing:0;margin-left:auto">Drag to reorder</span>
      </div>

      <div class="add-link-form">
        <div class="form-group">
          <label for="link-title-input">Title</label>
          <input id="link-title-input" type="text" placeholder="e.g. My YouTube Channel" maxlength="60" />
        </div>
        <div class="form-group">
          <label for="link-url-input">URL</label>
          <input id="link-url-input" type="url" placeholder="https://..." />
        </div>
        <label class="highlight-row">
          <span class="toggle-sw">
            <input type="checkbox" id="link-highlight-toggle">
            <span class="toggle-sl"></span>
          </span>
          ⚡ Highlight this link
        </label>
        <button class="btn btn-primary" id="add-link-btn" style="align-self:flex-end">+ Add Link</button>
      </div>

      <div id="links-list" class="links-list">
        <div class="empty-state"><div class="empty-state-icon">🔗</div><p>Loading…</p></div>
      </div>
    </section>

    <!-- ── RIGHT: Preview ── -->
    <section class="glass panel preview-panel">
      <div class="panel-title">📱 <span>Live Preview</span></div>
      <div class="preview-wrap">
        <p style="font-size:0.7rem;color:var(--text-muted)">How your page looks 👇</p>
        <div class="preview-phone" id="preview-phone">
          <div class="preview-content">
            <img id="preview-avatar" class="preview-avatar" src="" alt="preview" />
            <div id="preview-name" class="preview-name">Your Name</div>
            <div id="preview-bio"  class="preview-bio">Your bio…</div>
            <div id="preview-soc"  class="prev-soc-bar"></div>
            <div id="preview-links" style="width:100%;display:flex;flex-direction:column;gap:5px;margin-top:4px">
              <div style="font-size:0.6rem;color:var(--text-muted);text-align:center">Links appear here</div>
            </div>
          </div>
        </div>
        <a id="view-public-btn" href="#" target="_blank" class="btn btn-ghost btn-sm w-full" style="margin-top:var(--space-sm)">
          👁️ View Public Page
        </a>
      </div>
    </section>

  </main>

  <!-- Mobile Bottom Navigation -->
  <nav class="mobile-bottom-nav" id="mobile-bottom-nav">
    <button class="mobile-nav-btn active" data-panel="left-panel" id="mob-nav-profile">
      <span class="nav-icon">👤</span>
      <span>Profile</span>
    </button>
    <button class="mobile-nav-btn" data-panel="links-panel" id="mob-nav-links">
      <span class="nav-icon">🔗</span>
      <span>Links</span>
    </button>
    <button class="mobile-nav-btn" data-panel="preview-panel" id="mob-nav-preview">
      <span class="nav-icon">📱</span>
      <span>Preview</span>
    </button>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
  <script type="module" src="/js/dashboard.js"></script>

  <!-- Mobile Panel Switcher -->
  <script>
    (function() {
      const isMobile = () => window.matchMedia('(max-width: 768px)').matches;

      function initMobileNav() {
        const btns = document.querySelectorAll('.mobile-nav-btn');
        const panels = {
          'left-panel': document.querySelector('.left-panel'),
          'links-panel': document.querySelector('.links-panel'),
          'preview-panel': document.querySelector('.preview-panel'),
        };

        function switchPanel(panelKey) {
          // Remove active from all buttons
          btns.forEach(b => b.classList.remove('active'));
          // Hide all panels
          Object.values(panels).forEach(p => {
            if (p) p.classList.remove('mobile-active');
          });
          // Activate selected
          const activeBtn = document.querySelector(`[data-panel="${panelKey}"]`);
          if (activeBtn) activeBtn.classList.add('active');
          if (panels[panelKey]) {
            panels[panelKey].classList.add('mobile-active');
            // Scroll to top when switching
            window.scrollTo({ top: 0, behavior: 'smooth' });
          }
        }

        btns.forEach(btn => {
          btn.addEventListener('click', () => {
            switchPanel(btn.dataset.panel);
          });
        });

        // Set default active panel on mobile
        if (isMobile()) {
          switchPanel('left-panel');
        }
      }

      // Handle resize: restore panels on desktop
      function handleResize() {
        const allPanels = document.querySelectorAll('.left-panel, .links-panel, .preview-panel');
        if (!isMobile()) {
          // Desktop: remove all mobile classes
          allPanels.forEach(p => p.classList.remove('mobile-active'));
        } else {
          // Mobile: re-apply current active panel
          const activeBtn = document.querySelector('.mobile-nav-btn.active');
          if (activeBtn) {
            const panelKey = activeBtn.dataset.panel;
            allPanels.forEach(p => p.classList.remove('mobile-active'));
            const pMap = {
              'left-panel': '.left-panel',
              'links-panel': '.links-panel',
              'preview-panel': '.preview-panel'
            };
            document.querySelector(pMap[panelKey])?.classList.add('mobile-active');
          }
        }
      }

      // Init on DOM ready
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initMobileNav);
      } else {
        initMobileNav();
      }

      let resizeTimer;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(handleResize, 150);
      });
    })();
  </script>

</body>
</html>
