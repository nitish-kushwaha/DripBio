<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard — DripBio</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    .admin-layout {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 1rem;
      display: grid;
      gap: 1.5rem;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1rem;
    }
    .stat-card {
      padding: 1.5rem;
      border-radius: var(--radius-lg);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-glass);
      backdrop-filter: blur(12px);
      text-align: center;
    }
    .stat-val { font-size: 2.5rem; font-weight: 700; color: var(--neon-cyan); margin-bottom: 0.5rem; }
    .stat-label { font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em; }
    
    .table-card {
      background: rgba(20, 20, 30, 0.5);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-lg);
      overflow-x: auto;
    }
    table { width: 100%; border-collapse: collapse; min-width: 800px; }
    th {
      text-align: left; padding: 1rem;
      background: rgba(255,255,255,0.03);
      font-size: 0.75rem; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.1em;
      border-bottom: 1px solid var(--border-glass);
    }
    td {
      padding: 1rem; border-bottom: 1px solid rgba(255,255,255,0.05);
      font-size: 0.9rem; vertical-align: middle;
    }
    .badge {
      padding: 0.25rem 0.6rem; border-radius: 999px; font-size: 0.75rem; font-weight: 600;
    }
    .badge-verified { background: rgba(34,197,94,0.15); color: #4ade80; }
    .badge-unverified { background: rgba(239,68,68,0.15); color: #f87171; }
    .badge-admin { background: rgba(168,85,247,0.15); color: #c084fc; border: 1px solid #c084fc; display: inline-block; margin-top: 4px; }
  </style>
</head>
<body class="page-dashboard">

  <nav class="dash-nav" style="border-bottom-color: rgba(6,182,212,0.3)">
    <span class="dash-brand">DripBio<span style="color:var(--neon-purple)"> - ADMIN</span></span>
    <div class="dash-nav-right">
      <a href="/dashboard.html" class="btn btn-ghost btn-sm">Exit Admin</a>
    </div>
  </nav>

  <main class="admin-layout" id="admin-content" style="display:none">
    
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-val" id="stat-total-users">-</div>
        <div class="stat-label">Total Users</div>
      </div>
      <div class="stat-card">
        <div class="stat-val" id="stat-verified-users">-</div>
        <div class="stat-label">Verified Users</div>
      </div>
    </div>

    <div class="table-card" style="margin-bottom: 300px;">
      <div style="padding: 1rem 1.5rem; border-bottom: 1px solid var(--border-glass); display: flex; justify-content: space-between; align-items: center">
        <h2 style="font-size: 1.2rem">Platform Users</h2>
        <button id="refresh-btn" class="btn btn-ghost btn-sm">Refresh 🔄</button>
      </div>
      <table>
        <thead>
          <tr>
            <th>User</th>
            <th>Registered Email</th>
            <th>Mobile</th>
            <th>Joined</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="users-tbody">
          <tr><td colspan="6" style="text-align:center; padding: 3rem">Loading data...</td></tr>
        </tbody>
      </table>
    </div>

  </main>

  <!-- Loading State -->
  <div id="admin-loading" style="min-height: 80vh; display: flex; align-items: center; justify-content: center; gap: 1rem">
    <span class="spinner"></span> <span>Securing connection...</span>
  </div>

  <script type="module" src="/js/admin.js"></script>
</body>
</html>
