<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In — DripBio.bond</title>
  <meta name="description" content="Log in to your DripBio account and manage your links." />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="page-auth">

  <div class="glass auth-card">

    <div class="auth-logo">
      <a href="/" class="gradient-text">DripBio<span style="font-size:0.8em">.</span>bond</a>
    </div>

    <h1 class="auth-title">Welcome back 👋</h1>
    <p class="auth-subtitle">Log in to manage your links</p>

    <form class="auth-form" id="login-form" novalidate>

      <div class="form-group">
        <label for="login-email">Email</label>
        <input
          id="login-email"
          type="email"
          placeholder="you@example.com"
          autocomplete="email"
          required
        />
      </div>

      <div class="form-group">
        <label for="login-password">Password</label>
        <input
          id="login-password"
          type="password"
          placeholder="••••••••"
          autocomplete="current-password"
          required
        />
      </div>

      <button type="submit" class="btn btn-primary w-full" id="login-btn">
        Log In
      </button>

    </form>

    <p class="auth-footer">
      Don't have an account? <a href="/signup.html">Sign up free</a>
    </p>

  </div>

  <script type="module">
    import { logIn }      from '/js/auth.js';
    import { showToast }  from '/js/auth.js';
    import { auth }       from '/js/firebase-config.js';
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    // Already logged in → smart redirect
    onAuthStateChanged(auth, async user => {
      if (user) {
        await smartRedirect(user);
      }
    });

    async function smartRedirect(user) {
      try { await user.reload(); } catch {}
      const freshUser = auth.currentUser || user;

      if (!freshUser.emailVerified) {
        // Email not yet verified — send to email waiting page
        window.location.href = '/email-sent.html';
        return;
      }

      // Check Firestore for profile completion (isVerified flag)
      try {
        const { getDoc, doc } = await import("https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js");
        const { db } = await import('/js/firebase-config.js');
        const snap = await getDoc(doc(db, 'users', freshUser.uid));
        if (snap.exists() && snap.data().isVerified === true) {
          window.location.href = '/dashboard.html';
          return;
        }
        // Email verified but profile form not yet completed
        window.location.href = '/verify-complete.html';
      } catch {
        // Firestore error — fall back to dashboard
        window.location.href = '/dashboard.html';
      }
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email    = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      const btn      = document.getElementById('login-btn');

      if (!email || !password) { showToast('Please fill in all fields.', 'error'); return; }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Logging in…';

      try {
        const user = await logIn(email, password);
        await smartRedirect(user);
      } catch (err) {
        showToast(friendlyError(err.code), 'error');
        btn.disabled = false;
        btn.textContent = 'Log In';
      }
    });

    function friendlyError(code) {
      const map = {
        'auth/user-not-found':   'No account found with this email.',
        'auth/wrong-password':   'Wrong password. Try again!',
        'auth/invalid-email':    'Please enter a valid email.',
        'auth/too-many-requests':'Too many attempts. Please wait a moment.',
        'auth/invalid-credential': 'Invalid email or password.',
      };
      return map[code] || 'Login failed. Please try again.';
    }
  </script>

</body>
</html>
